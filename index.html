<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/svg+xml" href="network.svg">
    <title>Sign Up | CONCORDANCE </title>
</head>
<body>
    <div class="image-container">
        <img src="./index-image.jpg" class="hero-image">
        <div class="web-title">
            <img src="network.svg">
            <h1>CONCORDANCE</h1>
        </div>
        
    </div>
    <div class="content">
        <div class="content-container">
            <div class="intro">
                <h2>Do you want to see how deep the rabbit hole goes?</h2>
                <p>This is not a real online service.</p>
            </div>
            <div class="form-container">
                
                <div class="input-container">
                    <img src="user.svg">
                    <input type="text" id="first_name" placeholder="* First Name" autocomplete="off" required>                    
                </div>
                <div class="error-msg"></div>
                
                <div class="input-container">
                    <img src="mail.svg">
                    <input type="email" id="email_name" placeholder="* Email" autocomplete="off" required>
                </div>
                <div class="error-msg"></div>

                <div class="input-container">
                    <img src="lock.svg">
                    <input type="password" id="password" placeholder="* Password" minlength="8" autocomplete="off" required>
                </div>
                <div class="error-msg"></div>

                <div class="input-container">
                    <img src="lock.svg">
                    <input type="password" id="password-confirm" placeholder="* Password Confirmation" autocomplete="off" required>
                </div>
                <div class="error-msg"></div>

            </div>

            <div class="submit-container">
                <button type="submit" class="submit-btn">Red Pill (submit...)</button>
                <button class="dupe-btn" onclick="location.href='https://www.google.com/search?q=cats&udm=2';">Blue Pill</button>
            </div>
        </div>

        
    </div>
    <div id="fade-overlay"></div>
    
    <footer class="footer">
        <div class="footer-left">
            <p>Photo by Nathan J Hilton</p>
            <a href="https://www.pexels.com/photo/dynamic-london-night-scene-with-double-decker-bus-30692030/" target="_blank">
                <img class="pexels-logo" src="pexels.svg" />
            </a>
        </div>
        <div class="footer-right">
            <p>ScottEbr</p>
            <a href="https://github.com/ScottEbr" target="_blank">
                <img class="github-logo" src="github-mark.svg" />
            </a>
        </div>

        
    </footer>
    <script src="script.js"></script>
    
</body>
</html>
